name: Auto Merge to Develop

# 作業ブランチに push されたときに実行
#
# 対象は、コミットメッセージの接頭辞（Conventional Commits）に合わせた作業ブランチ
# 例：feat/sound-effect、fix/layout、chore/update-deps
#
# develop と main は、ここに書いていないので対象にならない
# （直接 push しても、この自動PR・自動マージは動かない）
#
# 新しい接頭辞を使いはじめるときは、ここに1行足すこと
on:
  push:
    branches:
      - "feat/**"
      - "feature/**"
      - "fix/**"
      - "refactor/**"
      - "chore/**"

# GitHub Actions に
# ・コードを書き込む権限
# ・Pull Request を作る権限
# を与える
permissions:
  contents: write
  pull-requests: write

jobs:
  # ========================================
  # ① buildできるか確認
  # ========================================
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      # GitHubからコードを取得
      - name: Checkout
        uses: actions/checkout@v4

      # Node.js 24を使用
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # package-lock.jsonを使って依存関係をインストール
      - name: Install dependencies
        run: npm ci

      # Nuxtのbuild確認
      - name: Build
        run: npm run build

  # ========================================
  # ② build成功後、PRを作ってdevelopへマージ
  # ========================================
  merge:
    name: Create PR and merge
    needs: build
    runs-on: ubuntu-latest

    env:
      # GitHub CLI（gh）が使うトークン
      GH_TOKEN: ${{ github.token }}

      # pushされたブランチ名
      # 例：fix/layout
      BRANCH_NAME: ${{ github.ref_name }}

    steps:
      - name: Create PR and merge
        run: |
          # ========================================
          # すでに同じブランチのPRがあるか確認
          # ========================================
          PR_NUMBER=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$BRANCH_NAME" \
            --base develop \
            --state open \
            --json number \
            --jq '.[0].number')

          # ========================================
          # PRがまだ無ければ作成
          # ========================================
          if [ -z "$PR_NUMBER" ]; then

            # 最新コミットのメッセージ全体を取得
            COMMIT_MESSAGE=$(gh api \
              "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" \
              --jq '.commit.message')

            # 1行目をPRタイトルにする
            #
            # 例：
            # git commit -m "fix: 表示崩れを修正"
            #
            # ↓
            #
            # PRタイトル：
            # fix: 表示崩れを修正
            COMMIT_TITLE=$(printf '%s\n' "$COMMIT_MESSAGE" | head -n 1)

            # 2行目以降をPR本文にする
            COMMIT_BODY=$(printf '%s\n' "$COMMIT_MESSAGE" | tail -n +2 | sed '/./,$!d')

            # ========================================
            # PR本文を作成
            # ========================================
            if [ -n "$COMMIT_BODY" ]; then
              printf '%s\n\n' "$COMMIT_BODY" > pr-body.md
            else
              printf '%s\n\n' "変更内容はコミットメッセージを参照してください。" > pr-body.md
            fi

            printf '%s\n' "---" >> pr-body.md
            printf '%s\n' "この Pull Request は GitHub Actions により自動作成されています。" >> pr-body.md

            # ========================================
            # Pull Requestを自動作成
            # ========================================
            PR_URL=$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base develop \
              --head "$BRANCH_NAME" \
              --title "$COMMIT_TITLE" \
              --body-file pr-body.md)

            # 作ったPRの番号を取得
            PR_NUMBER=$(gh pr view "$PR_URL" \
              --repo "$GITHUB_REPOSITORY" \
              --json number \
              --jq '.number')

          fi

          # ========================================
          # developへ自動マージ
          # ========================================
          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --delete-branch