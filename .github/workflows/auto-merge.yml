name: Auto Merge to Develop

on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
      - 'refactor/**'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  merge:
    name: Create PR and merge
    needs: build
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH_NAME: ${{ github.ref_name }}

    steps:
      - name: Create pull request if needed
        id: pr
        run: |
          PR_NUMBER=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$BRANCH_NAME" \
            --base develop \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -z "$PR_NUMBER" ]; then
            PR_URL=$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base develop \
              --head "$BRANCH_NAME" \
              --title "Auto merge: $BRANCH_NAME" \
              --body "GitHub Actions により自動作成された Pull Request です。")

            PR_NUMBER=$(gh pr view "$PR_URL" \
              --repo "$GITHUB_REPOSITORY" \
              --json number \
              --jq '.number')
          fi

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Merge pull request
        run: |
          gh pr merge "${{ steps.pr.outputs.pr_number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --delete-branch
