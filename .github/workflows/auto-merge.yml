name: Auto Merge to Develop

# fix/○○ ブランチに push されたときに実行
on:
  push:
    branches:
      - "fix/**"

# GitHub Actions に
# ・コードを書き込む権限
# ・Pull Request を作る権限
# を与える
permissions:
  contents: write
  pull-requests: write

jobs:
  # ========================================
  # ① buildできるか確認
  # ========================================
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      # GitHubからコードを取得
      - name: Checkout
        uses: actions/checkout@v4

      # Node.js 24を使用
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # package-lock.jsonを使って依存関係をインストール
      - name: Install dependencies
        run: npm ci

      # Nuxtのbuild確認
      - name: Build
        run: npm run build

  # ========================================
  # ② build成功後、PRを作ってdevelopへマージ
  # ========================================
  merge:
    name: Create PR and merge
    needs: build
    runs-on: ubuntu-latest

    env:
      # GitHub CLI（gh）が使うトークン
      GH_TOKEN: ${{ github.token }}

      # pushされたブランチ名
      # 例：fix/layout
      BRANCH_NAME: ${{ github.ref_name }}

    steps:
      - name: Create PR and merge
        id: pr
        run: |
          # ========================================
          # すでに同じブランチのPRがあるか確認
          # ========================================
          PR_NUMBER=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$BRANCH_NAME" \
            --base develop \
            --state open \
            --json number \
            --jq '.[0].number')

          # ========================================
          # PRがまだ無ければ作成
          # ========================================
          if [ -z "$PR_NUMBER" ]; then

            # 最後のコミットメッセージの1行目を取得
            #
            # 例：
            # git commit -m "表示崩れを修正"
            #
            # ↓
            #
            # PRタイトル
            # 「表示崩れを修正」
            COMMIT_TITLE=$(gh api \
              "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" \
              --jq '.commit.message' | head -n 1)

            # Pull Requestを自動作成
            PR_URL=$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base develop \
              --head "$BRANCH_NAME" \
              --title "$COMMIT_TITLE" \
              --body "GitHub Actions により自動作成された Pull Request です。")

            # 作ったPRの番号を取得
            PR_NUMBER=$(gh pr view "$PR_URL" \
              --repo "$GITHUB_REPOSITORY" \
              --json number \
              --jq '.number')

          fi

          # ========================================
          # developへ自動マージ
          # ========================================
          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --delete-branch